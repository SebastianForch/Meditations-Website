<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline – Meditation PWA</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body {
        font-family:  'Georgia', serif;
        margin: 0;
        padding: 0;
        background-color: #f4f1e6; /* sanftes Beige */
        color: #5b4636;
        overflow-x: hidden;
        text-align: center;
        font-size: 1.5em; /* Vergrößert die Schrift für den gesamten Body */
        margin-top: 50px;
      }
      img {
        max-height: 100%; /* Bild wird nie breiter als sein Container */
        width: auto; /* Höhe passt sich automatisch an */
        display: block;
        margin-left: auto;
        margin-right: auto;
      }
      </style>
  </head>
  <body> 
    <h1>Du bist offline</h1>
    <p>Die Inhalte dieser Website sind aktuell nicht verfügbar. Bitte überprüfe deine Internetverbindung.</p>
    <img src="bilder/Lotus_Logo.jpg" alt="Lotus-Logo" style="margin-top: 20px;">
  </body>
</html>
